name: pull_request_check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set up pnpm
        run: npm install --global pnpm@10.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run format
      - run: pnpm run lint
      - name: Check format status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Something was not formatted properly."
            git --no-pager diff
            exit 1
          fi
